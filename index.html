<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKT DIGITAL - India Services</title>
    <style>
        /* आपका ओरिजिनल स्टाइल बिल्कुल वैसा ही है */
        * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        :root { 
            --light-green: #90EE90; 
            --green-shadow: #76c776; 
            --dark-bg: #1a1a1a; 
            --ad-black: #000000; 
            --white-bg: #ffffff; 
            --text-color: #000000;
            --card-bg: #ffffff;
        }
        body.night-mode {
            --white-bg: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --dark-bg: #000000;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: var(--white-bg); color: var(--text-color); overflow-x: hidden; }
        .site-branding { background-color: var(--dark-bg); color: var(--light-green); text-align: center; padding: 20px 0; border-bottom: 4px solid var(--light-green); text-transform: uppercase; animation: fastHeartBeat 0.8s ease-in-out infinite; display: block; }
        .branding-title { font-size: clamp(32px, 10vw, 48px); font-weight: 950; margin: 0; }
        .branding-subtitle { font-size: 18px; font-weight: 800; display: block; letter-spacing: 6px; color: #fff; }
        .ad-container { background-color: var(--ad-black); border-top: 5px solid var(--light-green); border-bottom: 5px solid var(--light-green); width: 100%; }
        .ad-banner { padding: 15px 0 5px 0; overflow: hidden; display: flex; }
        .ad-text { display: inline-block; white-space: nowrap; animation: moveLeft 20s linear infinite; font-size: 18px; font-weight: 900; color: var(--light-green); }
        @keyframes moveLeft { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .ad-static-actions { background-color: var(--ad-black); text-align: center; padding: 10px 0 20px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .ad-static-btn { background-color: var(--light-green); color: #000; padding: 10px 15px; border-radius: 50px; text-decoration: none; font-size: 13px; font-weight: 900; text-transform: uppercase; box-shadow: 0 4px 0 var(--green-shadow); border: none; cursor: pointer; }
        .mode-btn { background-color: #f1f1f1; }
        body.night-mode .mode-btn { background-color: #333; color: #fff; box-shadow: 0 4px 0 #000; }
        .form-btn { background-color: #673ab7 !important; color: white !important; animation: fastHeartBeat 0.8s ease-in-out infinite; }
        .main-header { text-align: center; background-color: var(--light-green); padding: 25px 0 10px 0; margin: 0; width: 100%; color: #000; }
        .main-title { font-size: clamp(30px, 8vw, 50px); font-weight: 900; margin: 0; animation: fastHeartBeat 0.8s ease-in-out infinite; }
        @keyframes fastHeartBeat { 0%, 28%, 70% { transform: scale(1); } 14%, 42% { transform: scale(1.08); } }
        
        /* New Filter Style */
        .filter-section { background: var(--card-bg); padding: 15px; border-bottom: 4px solid var(--light-green); display: flex; flex-direction: column; gap: 10px; }
        .filter-select { padding: 12px; border-radius: 10px; border: 2px solid var(--light-green); font-weight: bold; background: var(--white-bg); color: var(--text-color); }

        .nav-container { background-color: var(--dark-bg); padding: 20px 0; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: flex-start; gap: 10px; border-bottom: 4px solid var(--light-green); overflow-x: auto; padding-left: 10px; }
        .tab-btn { font-size: 16px; padding: 12px 20px; font-weight: 900; cursor: pointer; border: none; border-radius: 50px; background-color: var(--light-green); box-shadow: 0 6px 0 var(--green-shadow); white-space: nowrap; }
        .tab-btn.active { background-color: #fff; color: #000; transform: translateY(4px); box-shadow: 0 2px 0 var(--green-shadow); }
        .container { padding: 15px; max-width: 1100px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; }
        .list-card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 6px solid var(--light-green); margin-bottom: 15px; }
        .search-bar { width: 100%; padding: 18px; margin-bottom: 25px; border-radius: 50px; border: 4px solid var(--light-green); font-size: 18px; font-weight: bold; background: var(--card-bg); color: var(--text-color); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .action-btn { font-size: 11px; padding: 12px 2px; text-decoration: none; color: #000; border-radius: 50px; text-align: center; font-weight: 900; background-color: var(--light-green); box-shadow: 0 4px 0 var(--green-shadow); text-transform: uppercase; border: none; }
    </style>
</head>
<body>

<div class="site-branding">
    <div class="branding-title">💎 CKT DIGITAL</div>
    <span class="branding-subtitle">INDIA SERVICE</span>
</div>

<div class="ad-container">
    <div class="ad-banner"><div class="ad-text">📢 विज्ञापन: अपनी शॉप को पूरे भारत में प्रमोट करें - बेस्ट सर्विस और बेस्ट रेट | संपर्क करें: +91 7908955101 📢</div></div>
    <div class="ad-static-actions">
        <a href="tel:7908955101" class="ad-static-btn">📞 CALL</a>
        <button class="ad-static-btn mode-btn" onclick="toggleNightMode()" id="modeBtn">🌙 NIGHT</button>
        <a href="https://wa.me/917908955101" class="ad-static-btn">💬 WHATSAPP</a>
        <a href="YOUR_GOOGLE_FORM_LINK_HERE" target="_blank" class="ad-static-btn form-btn">📝 REGISTER SHOP</a>
    </div>
</div>

<div class="filter-section">
    <select id="stateSelect" class="filter-select" onchange="updateDistricts()">
        <option value="">-- राज्य (State) चुनें --</option>
    </select>
    <select id="districtSelect" class="filter-select" onchange="applyLocationFilter()">
        <option value="">-- जिला (District) चुनें --</option>
    </select>
</div>

<div class="nav-container" id="tabMenu"></div>
<div class="container" id="contentArea"></div>

<script>
    // 1. Data Structure for India (इसे आप बढ़ा सकते हैं)
    const indiaData = {
        "West Bengal": ["Paschim Medinipur", "Purba Medinipur", "Kolkata", "Howrah"],
        "Bihar": ["Patna", "Gaya", "Muzaffarpur", "Bhagalpur"],
        "Jharkhand": ["Ranchi", "Jamshedpur", "Dhanbad"],
        "Uttar Pradesh": ["Lucknow", "Varanasi", "Kanpur"]
    };

    // 2. Sample Shop Data (इसमें 'dist' की-वर्ड जोड़ दिया है)
    const shopData = {
        saloon: {
            title: "Saloon", icon: "💇", 
            rates: ["Hair Cut: ₹100", "Shaving: ₹50"],
            partners: [
                { name: "CKT Luxury Saloon", address: "Kharagpur, WB", dist: "Paschim Medinipur", mobile: "7908955101", whatsapp: "917908955101" },
                { name: "Patna Style Zone", address: "Boring Road, Patna", dist: "Patna", mobile: "9876543210", whatsapp: "919876543210" }
            ]
        },
        doctor: {
            title: "Doctor", icon: "⚕️",
            rates: ["Consultation: ₹500"],
            partners: [
                { name: "City Clinic", address: "Gaya, Bihar", dist: "Gaya", mobile: "9999999999", whatsapp: "919999999999" }
            ]
        }
    };

    function toggleNightMode() {
        document.body.classList.toggle('night-mode');
        const btn = document.getElementById('modeBtn');
        btn.innerHTML = document.body.classList.contains('night-mode') ? "☀️ LIGHT" : "🌙 NIGHT";
    }

    function init() {
        // Populate States
        const stateSelect = document.getElementById('stateSelect');
        Object.keys(indiaData).forEach(state => {
            let opt = document.createElement('option');
            opt.value = state; opt.innerText = state;
            stateSelect.appendChild(opt);
        });

        const tabMenu = document.getElementById('tabMenu');
        const contentArea = document.getElementById('contentArea');
        
        Object.keys(shopData).forEach((key, index) => {
            // Create Tabs
            const btn = document.createElement('button');
            btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = shopData[key].title;
            btn.onclick = (e) => showSection(key, e.target);
            tabMenu.appendChild(btn);

            // Create Sections
            const section = document.createElement('div');
            section.id = key;
            section.className = `section ${index === 0 ? 'active' : ''}`;
            
            section.innerHTML = `
                <div class="rate-card">
                    <h2>${shopData[key].icon} ${shopData[key].title}</h2>
                    <ul>${shopData[key].rates.map(r => `<li>${r}</li>`).join('')}</ul>
                </div>
                <input type="text" class="search-bar" placeholder="खोजें..." onkeyup="filterList('${key}List', this.value)">
                <div id="${key}List" class="grid-container">
                    ${renderPartners(shopData[key].partners, key)}
                </div>
            `;
            contentArea.appendChild(section);
        });
    }

    function renderPartners(partners, key) {
        return partners.map(p => `
            <div class="list-card" data-dist="${p.dist}">
                <h3>${p.name}</h3>
                <p>📍 ${p.address}</p>
                <p>📞 ${p.mobile}</p>
                <div class="btn-group">
                    <a href="tel:${p.mobile}" class="action-btn">CALL</a>
                    <a href="https://wa.me/${p.whatsapp}" class="action-btn">WHATSAPP</a>
                </div>
            </div>
        `).join('');
    }

    function updateDistricts() {
        const state = document.getElementById('stateSelect').value;
        const distSelect = document.getElementById('districtSelect');
        distSelect.innerHTML = '<option value="">-- जिला (District) चुनें --</option>';
        
        if(state && indiaData[state]) {
            indiaData[state].forEach(d => {
                let opt = document.createElement('option');
                opt.value = d; opt.innerText = d;
                distSelect.appendChild(opt);
            });
        }
        applyLocationFilter();
    }

    function applyLocationFilter() {
        const selectedDist = document.getElementById('districtSelect').value;
        const cards = document.querySelectorAll('.list-card');
        
        cards.forEach(card => {
            if (selectedDist === "" || card.getAttribute('data-dist') === selectedDist) {
                card.style.display = "block";
            } else {
                card.style.display = "none";
            }
        });
    }

    function showSection(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function filterList(listId, query) {
        const term = query.toLowerCase();
        const cards = document.querySelectorAll(`#${listId} .list-card`);
        cards.forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none";
        });
    }

    window.onload = init;
</script>
</body>
</html>
