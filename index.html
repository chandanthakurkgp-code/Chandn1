<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKT DIGITAL - Kharagpur Services</title>
    <style>
        * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        
        :root { 
            --light-green: #90EE90; 
            --green-shadow: #76c776; 
            --dark-bg: #1a1a1a; 
            --ad-black: #000000; 
            --white-bg: #ffffff; 
            --text-color: #000000;
            --card-bg: #ffffff;
        }

        body.night-mode {
            --white-bg: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --dark-bg: #000000;
        }
        
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--white-bg); 
            color: var(--text-color);
            overflow-x: hidden; 
        }

        /* 1. BRANDING - धड़कन (0.8s) */
        .site-branding {
            background-color: var(--dark-bg);
            color: var(--light-green);
            text-align: center;
            padding: 20px 0;
            border-bottom: 4px solid var(--light-green);
            text-transform: uppercase;
            animation: fastHeartBeat 0.8s ease-in-out infinite;
            display: block;
        }
        .branding-title { font-size: clamp(32px, 10vw, 48px); font-weight: 950; margin: 0; }
        .branding-subtitle { font-size: 18px; font-weight: 800; display: block; letter-spacing: 6px; color: #fff; }

        /* 2. मुख्य विज्ञापन पट्टी */
        .ad-container { background-color: var(--ad-black); border-top: 5px solid var(--light-green); border-bottom: 5px solid var(--light-green); width: 100%; }
        .ad-banner { padding: 15px 0 5px 0; overflow: hidden; display: flex; }
        .ad-text { display: inline-block; white-space: nowrap; animation: moveLeft 20s linear infinite; font-size: 18px; font-weight: 900; color: var(--light-green); }
        @keyframes moveLeft { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .ad-static-actions { 
            background-color: var(--ad-black); 
            text-align: center; padding: 10px 0 20px 0; 
            display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; 
        }
        .ad-static-btn { 
            background-color: var(--light-green); color: #000; padding: 10px 15px; 
            border-radius: 50px; text-decoration: none; font-size: 13px; font-weight: 900; 
            text-transform: uppercase; box-shadow: 0 4px 0 var(--green-shadow); border: none; cursor: pointer;
        }

        .mode-btn { background-color: #f1f1f1; }
        body.night-mode .mode-btn { background-color: #333; color: #fff; box-shadow: 0 4px 0 #000; }
        .form-btn { background-color: #673ab7 !important; color: white !important; animation: fastHeartBeat 0.8s ease-in-out infinite; }

        /* 3. MAIN HEADER */
        .main-header { text-align: center; background-color: var(--light-green); padding: 25px 0 10px 0; margin: 0; width: 100%; color: #000; }
        .main-title { font-size: clamp(30px, 8vw, 50px); font-weight: 900; margin: 0; animation: fastHeartBeat 0.8s ease-in-out infinite; }
        .main-subtitle { font-size: 16px; font-weight: 800; color: #333; letter-spacing: 2px; }

        @keyframes fastHeartBeat { 0%, 28%, 70% { transform: scale(1); } 14%, 42% { transform: scale(1.08); } }

        /* 4. विजिटर काउंटर */
        .visitor-counter {
            background: var(--dark-bg);
            color: var(--light-green);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-bottom: 3px solid var(--light-green);
            font-weight: 900;
            font-size: 14px;
        }
        .counter-box img { 
            height: 25px; 
            border: 1px solid var(--light-green); 
            border-radius: 4px; 
            vertical-align: middle;
        }

        /* 5. AIRPLANE AD */
        .new-marquee-ad { background-color: #f1f1f1; padding: 12px 0; border-bottom: 3px solid var(--light-green); overflow: hidden; display: flex; white-space: nowrap; color: #333; }
        body.night-mode .new-marquee-ad { background-color: #333; color: #fff; }
        .marquee-content { display: inline-block; animation: moveLeft 15s linear infinite; font-size: 16px; font-weight: 800; }

        /* 6. NEW LOCATION SELECTOR STYLE (Added to support your request) */
        .location-box { background: var(--dark-bg); padding: 15px; display: flex; gap: 10px; overflow-x: auto; border-bottom: 4px solid var(--light-green); }
        .loc-select { padding: 10px; border-radius: 10px; border: 2px solid var(--light-green); background: #000; color: var(--light-green); font-weight: 900; min-width: 150px; }

        /* NAVIGATION & CARDS */
        .nav-container { background-color: var(--dark-bg); padding: 20px 0; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: flex-start; gap: 10px; border-bottom: 4px solid var(--light-green); overflow-x: auto; padding-left: 10px; }
        .tab-btn { font-size: 16px; padding: 12px 20px; font-weight: 900; cursor: pointer; border: none; border-radius: 50px; background-color: var(--light-green); box-shadow: 0 6px 0 var(--green-shadow); white-space: nowrap; }
        .tab-btn.active { background-color: #fff; color: #000; transform: translateY(4px); box-shadow: 0 2px 0 var(--green-shadow); }

        .container { padding: 15px; max-width: 1100px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; }

        .list-card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 6px solid var(--light-green); box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; margin-bottom: 15px; }
        .list-card h3 { color: var(--light-green); border-bottom: 1px solid #444; padding-bottom: 5px; }
        .shared-highlight { border: 8px solid #FFD700 !important; box-shadow: 0 0 25px rgba(255, 215, 0, 0.7) !important; transform: scale(1.05); }

        .rate-card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 6px solid var(--light-green); margin-bottom: 20px; }
        .search-bar { width: 100%; padding: 18px; margin-bottom: 25px; border-radius: 50px; border: 4px solid var(--light-green); font-size: 18px; font-weight: bold; background: var(--card-bg); color: var(--text-color); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .action-btn { font-size: 11px; padding: 12px 2px; text-decoration: none; color: #000; border-radius: 50px; text-align: center; font-weight: 900; background-color: var(--light-green); box-shadow: 0 4px 0 var(--green-shadow); text-transform: uppercase; border: none; }
    </style>
</head>
<body>

<div class="site-branding">
    <div class="branding-title">🚀 CKT DIGITAL</div>
    <span class="branding-subtitle">SERVICE</span>
</div>

<div class="ad-container">
    <div class="ad-banner"><div class="ad-text">🔥 विज्ञापन: खड़गपुर की नंबर 1 शॉप - बेस्ट सर्विस और बेस्ट रेट | संपर्क करें: +91 7908955101 🔥</div></div>
    <div class="ad-static-actions">
        <a href="tel:7908955101" class="ad-static-btn">📞 CALL</a>
        <button class="ad-static-btn mode-btn" onclick="toggleNightMode()" id="modeBtn">🌙 NIGHT</button>
        <a href="https://wa.me/917908955101" class="ad-static-btn">💬 WHATSAPP</a>
        <a href="YOUR_GOOGLE_FORM_LINK_HERE" target="_blank" class="ad-static-btn form-btn">📝 ADD YOUR SHOP</a>
        <button onclick="shareMain()" class="ad-static-btn">📤 SHARE SITE</button>
    </div>
</div>

<div class="main-header">
    <h1 class="main-title">KHARAGPUR</h1>
    <div class="main-subtitle">SHOPS & SERVICES</div>
</div>

<div class="visitor-counter">
    <p style="margin:0">TOTAL FOOTFALL:</p>
    <div class="counter-box">
        <a href="https://www.freecounterstat.com" title="website counter"><img src="https://counter9.stat.ovh/private/freecounterstat.php?c=89mj8m1w5w727m616lyq2v269v2k253m" border="0" title="website counter" alt="website counter"></a>
    </div>
</div>

<div class="new-marquee-ad">
    <div class="marquee-content">
        🚀 धमाका! खड़गपुर की टॉप सर्विसेज के लिए CKT DIGITAL पर आज ही अपनी शॉप लिस्ट करें! 🚀
    </div>
</div>

<div class="location-box">
    <select id="stateSelect" class="loc-select" onchange="loadDistricts()">
        <option value="">Select State</option>
        <option value="West Bengal">West Bengal</option>
        <option value="Bihar">Bihar</option>
        <option value="Jharkhand">Jharkhand</option>
    </select>
    <select id="districtSelect" class="loc-select" onchange="filterShopsByLocation()">
        <option value="">Select District</option>
    </select>
</div>

<div class="nav-container" id="tabMenu"></div>
<div class="container" id="contentArea"></div>

<script>
    // आपका ओरिजिनल डेटा लोड करने का तरीका
    // (यहाँ मान लेते हैं कि आपकी पुरानी JS फाइल्स में डेटा है)
    const saloonData = { saloon: { title: "Saloon", icon: "💇", rates: ["Cut: ₹100"], partners: [{name: "Sample Shop", address: "KGP Town", dist: "Paschim Medinipur", mobile: "0000", whatsapp: "0000"}] } };
    const autoData = {}; const doctorData = {}; const electricianData = {}; const teacherData = {};

    const shopData = { ...saloonData, ...autoData, ...doctorData, ...electricianData, ...teacherData };

    // इंडिया के जिलों का डेटा (इसे आप बढ़ा सकते हैं)
    const distData = {
        "West Bengal": ["Paschim Medinipur", "Purba Medinipur", "Kolkata", "Howrah"],
        "Bihar": ["Patna", "Gaya", "Muzaffarpur"],
        "Jharkhand": ["Ranchi", "Dhanbad", "Jamshedpur"]
    };

    function loadDistricts() {
        const state = document.getElementById('stateSelect').value;
        const distBox = document.getElementById('districtSelect');
        distBox.innerHTML = '<option value="">Select District</option>';
        if(state && distData[state]) {
            distData[state].forEach(d => {
                distBox.innerHTML += `<option value="${d}">${d}</option>`;
            });
        }
        filterShopsByLocation();
    }

    function filterShopsByLocation() {
        const d = document.getElementById('districtSelect').value.toLowerCase();
        const cards = document.querySelectorAll('.list-card');
        cards.forEach(c => {
            if(d === "" || c.innerText.toLowerCase().includes(d)) {
                c.style.display = "block";
            } else {
                c.style.display = "none";
            }
        });
    }

    // आपके बाकी सभी पुराने फंक्शन्स (toggleNightMode, init, share, filterList) बिना किसी बदलाव के यहाँ हैं
    function toggleNightMode() {
        document.body.classList.toggle('night-mode');
        const btn = document.getElementById('modeBtn');
        if (document.body.classList.contains('night-mode')) {
            btn.innerHTML = "☀️ LIGHT";
            localStorage.setItem('theme', 'night');
        } else {
            btn.innerHTML = "🌙 NIGHT";
            localStorage.setItem('theme', 'light');
        }
    }

    window.onload = function() {
        if(localStorage.getItem('theme') === 'night') {
            document.body.classList.add('night-mode');
            document.getElementById('modeBtn').innerHTML = "☀️ LIGHT";
        }
        init();
    };

    function init() {
        const tabMenu = document.getElementById('tabMenu');
        const contentArea = document.getElementById('contentArea');
        const keys = Object.keys(shopData);
        
        keys.forEach((key, index) => {
            const btn = document.createElement('button');
            btn.id = `btn-${key}`;
            btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = shopData[key].title;
            btn.onclick = (e) => showSection(key, e.target);
            tabMenu.appendChild(btn);

            const section = document.createElement('div');
            section.id = key;
            section.className = `section ${index === 0 ? 'active' : ''}`;
            
            let partnersHtml = '';
            shopData[key].partners.forEach((p) => {
                const cardBtn = p.cardLink ? `<a href="${p.cardLink}" target="_blank" class="action-btn" style="background-color: #ff9800; color: white;">📂 CARD</a>` : '';
                const googleMapUrl = `https://www.google.com/maps/search/${encodeURIComponent(p.name + ' ' + p.address)}`;
                const shopId = p.name.replace(/\s+/g, '-').toLowerCase();

                partnersHtml += `
                    <div class="list-card" id="card-${shopId}">
                        <h3>${p.name}</h3>
                        <p>📍 ${p.address}</p>
                        <p>📞 ${p.mobile}</p>
                        <div class="btn-group">
                            <a href="tel:${p.mobile}" class="action-btn">📞 CALL</a>
                            <a href="https://wa.me/${p.whatsapp}" class="action-btn">💬 WHATSAPP</a>
                            ${cardBtn}
                            <a href="${googleMapUrl}" target="_blank" class="action-btn" style="background-color: #ffeb3b;">📍 MAPS</a>
                            <button onclick="shareShop('${p.name}', '${p.address}', '${key}', '${shopId}')" class="action-btn" style="background-color: #03a9f4; color: white; grid-column: span 2;">📤 SHARE THIS SHOP</button>
                        </div>
                    </div>`;
            });

            section.innerHTML = `
                <div class="rate-card">
                    <h2>${shopData[key].icon} ${shopData[key].title}</h2>
                    <ul class="rate-list">${shopData[key].rates.map(r => `<li>${r}</li>`).join('')}</ul>
                </div>
                <input type="text" class="search-bar" placeholder="${shopData[key].title} में खोजें..." onkeyup="filterList('${key}List', this.value)">
                <div id="${key}List" class="grid-container">${partnersHtml}</div>
            `;
            contentArea.appendChild(section);
        });
    }

    function showSection(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const target = document.getElementById(id);
        if(target) target.classList.add('active');
        if(btn) btn.classList.add('active');
        window.history.pushState(null, null, '#' + id);
    }

    function shareShop(name, address, category, shopId) {
        const text = `*${name}*\n📍 पता: ${address}\n\nइसे CKT Digital पर देखें:`;
        const shareUrl = window.location.origin + window.location.pathname + '#' + category + '|' + shopId;
        if (navigator.share) {
            navigator.share({ title: name, text: text, url: shareUrl });
        } else {
            window.open(`https://wa.me/?text=${encodeURIComponent(text + " " + shareUrl)}`, '_blank');
        }
    }

    function shareMain() {
        const text = "CKT Digital - खड़गपुर की लोकल सर्विसेज यहाँ देखें:";
        window.open(`https://wa.me/?text=${encodeURIComponent(text + " " + window.location.href)}`, '_blank');
    }

    function filterList(listId, query) {
        const term = query.toLowerCase();
        const cards = document.querySelectorAll(`#${listId} .list-card`);
        cards.forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none";
        });
    }
</script>
</body>
</html>
